# Explicit opt-in: docker compose -f docker-compose.yaml -f docker-compose.resume.yaml ...
x-resume-common: &resume-common
  image: newstar-airflow-resume:3.3.2
  build:
    context: .
    dockerfile: resume/Dockerfile
  environment:
    PYTHONPATH: /opt/airflow/dags
    RESUME_WORKSPACE: /opt/airflow/resume_workspace
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    RESUME_DEFAULT_CASE: ${RESUME_DEFAULT_CASE:-demo}
    RESUME_DEFAULT_TARGET: ${RESUME_DEFAULT_TARGET:-}
    RESUME_DEFAULT_MODE: ${RESUME_DEFAULT_MODE:-deepseek}
  volumes:
    - ./resume_workspace:/opt/airflow/resume_workspace

services:
  airflow-apiserver:
    <<: *resume-common
  airflow-scheduler:
    <<: *resume-common
  airflow-dag-processor:
    <<: *resume-common
  airflow-worker:
    <<: *resume-common
  airflow-triggerer:
    <<: *resume-common
  airflow-init:
    <<: *resume-common
  airflow-cli:
    <<: *resume-common
  resume-portal:
    <<: *resume-common
    command: ["python", "-m", "resume_flow.portal"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PYTHONPATH: /opt/airflow/dags
      RESUME_WORKSPACE: /opt/airflow/resume_workspace
      RESUME_PORTAL_BIND: 0.0.0.0
      AIRFLOW_API_URL: http://airflow-apiserver:8080
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-${_AIRFLOW_WWW_USER_USERNAME:-airflow}}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-${_AIRFLOW_WWW_USER_PASSWORD:-airflow}}
      AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./resume_workspace:/opt/airflow/resume_workspace
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/')"]
      interval: 20s
      timeout: 5s
      retries: 3
