<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历工作台 · 审阅</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/template.css"><script defer src="/app.js"></script></head>
<body><header><a href="/">← 返回工作台</a><span class="brand">简历编辑</span><span id="case"></span></header><main>
<div class="intro compact-intro"><h1>完善你的简历</h1><p>补充信息、核对经历，完成后生成 Word / PDF。</p><p id="sample" class="notice" hidden>虚构样例 · 用于测试流程</p></div>
<div class="layout"><section class="editor">
<h2>基本信息</h2><div class="basic-fields">
<label for="basic-name">姓名<input id="basic-name" required autocomplete="name"></label>
<label for="basic-headline">求职方向<input id="basic-headline" placeholder="如 AI 应用开发实习"></label>
<label for="basic-phone">手机<input id="basic-phone" type="tel" autocomplete="tel"></label>
<label for="basic-email">邮箱<input id="basic-email" type="email" autocomplete="email"></label>
<label for="basic-website">个人主页 / GitHub<input id="basic-website" placeholder="github.com/你的用户名"></label>
<label for="basic-location">意向城市<input id="basic-location" placeholder="如 武汉 / 北京"></label>
<label for="basic-availability" class="full-field">实习时间与到岗安排<textarea id="basic-availability" rows="2" placeholder="每行一条，如寒暑假时间、每周到岗天数"></textarea></label>
</div>
<div class="photo-controls"><label for="photo-file">照片（可选）<input id="photo-file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg"></label><button id="remove-photo" type="button" class="secondary" hidden>移除照片</button></div><p id="photo-status" class="hint" role="status" aria-live="polite">可上传 PNG / JPG，最多 2 MB。</p>
<h2>教育背景</h2><p class="hint">按实际情况填写，缺失项可以留空。</p><div class="basic-fields education-fields">
<label for="edu-school">学校<input id="edu-school"></label><label for="edu-college">院系<input id="edu-college"></label>
<label for="edu-major">专业<input id="edu-major"></label><label for="edu-degree">学历 / 年级<input id="edu-degree" placeholder="如 本科在读（大二）"></label>
<label for="edu-start">入学时间<input id="edu-start" placeholder="如 2025.09"></label><label for="edu-end">毕业时间<input id="edu-end" placeholder="如 2029.06（预计）"></label>
<label for="edu-gpa">GPA / 成绩<input id="edu-gpa" placeholder="如 3.93 / 4.00"></label><label for="edu-courses">相关课程<input id="edu-courses" placeholder="可附已核实成绩"></label>
</div>
<section class="completion-panel"><h2>需要你补充或核对 <span id="count"></span></h2><ul id="completion-list"></ul><div id="questions"></div></section>
<h2>经历与技能</h2><p class="hint">项目建议写清名称、本人负责的工作、技术方法和结果。未核实的数字请先删除或核对。</p><div id="body-editor"></div><button id="add-project" type="button" class="secondary">新增项目经历</button>
<details class="advanced-editor"><summary>高级编辑 · 正文 JSON</summary><label for="resume">完整正文数据</label><textarea id="resume" spellcheck="false"></textarea></details>
<details class="source-details"><summary>查看全部材料依据</summary><div id="facts"></div></details>
<h2>选择版式</h2><div class="templates" role="group" aria-label="简历模板">
<label><input type="radio" name="template" value="classic"><b>细线标题</b><small>双列信息 · 细横线</small></label>
<label><input type="radio" name="template" value="minimal"><b>灰条标题</b><small>灰底栏目 · 左侧竖线</small></label>
<label><input type="radio" name="template" value="technical"><b>浅色卡片</b><small>信息标签 · 浅色技能卡片</small></label></div>
<div class="options"><label>使用方式 <select id="mode"><option value="print">纸质投递</option><option value="digital">电子投递</option></select></label><label>纸张 <select id="paper"><option>A4</option><option>Letter</option></select></label></div>
<div class="actions"><button id="save" class="secondary">保存修改</button><button id="approve">确认并生成 Word/PDF</button></div><p id="status" role="status" aria-live="polite"></p>
<section id="exports" hidden><h2>导出与下载</h2><p id="export-status" role="status"></p><p id="export-location" class="hint"></p><div id="downloads" class="actions"></div><div id="pages"></div><div class="final-acceptance"><label id="accept-label" hidden><input type="checkbox" id="all-pages"><span>我已逐页查看，确认内容、字体和分页正确</span></label><button id="accept" hidden>确认最终版本</button></div></section>
</section><aside><div class="preview-heading"><h2>简历预览</h2><span>实际分页以 PDF 为准</span></div><article id="preview" class="paper"></article></aside></div></main><footer>资料在本机编辑 · 本页不调用模型</footer></body></html>
